name: Python Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -e .

      - name: Download release asset and extract JARs
        run: |
          # Download the latest release wheel asset using GitHub CLI
          gh release download --repo canabrook/berrywave-python --pattern "*.whl" --dir temp_wheel

          # Unzip the wheel to extract the bundled Java binaries
          unzip temp_wheel/*.whl -d temp_extracted

          # Ensure the destination directory exists and move the JAR files over
          mkdir -p berrywave/runtime/java
          cp temp_extracted/berrywave/runtime/java/*.jar berrywave/runtime/java/

          # Clean up temporary directories
          rm -rf temp_wheel temp_extracted
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run tests with pytest
        run: |
          pytest